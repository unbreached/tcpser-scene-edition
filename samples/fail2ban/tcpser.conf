# Fail2Ban configuration for TCPSER
# Place in /etc/fail2ban/jail.d/

[tcpser-auth]
enabled = true
port = 443,80
filter = tcpser-auth
logpath = /var/log/nginx/tcpser.access.log
maxretry = 5
findtime = 300
bantime = 3600
action = iptables-multiport[name=tcpser, port="http,https"]

[tcpser-flood]
enabled = true
port = 443,80
filter = tcpser-flood
logpath = /var/log/nginx/tcpser.access.log
maxretry = 50
findtime = 60
bantime = 600
action = iptables-multiport[name=tcpser-flood, port="http,https"]
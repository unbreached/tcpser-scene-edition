# Fail2Ban jails for TCPSER
# Place in /etc/fail2ban/jail.d/   (filters go in /etc/fail2ban/filter.d/)

# --- Modem port: callers that keep failing the bot gate -------------------
# Reads tcpser's own log (start tcpser with -L /var/log/tcpser/tcpser.log -l 4).
# tcpser already blocks an IP itself after -F failures; this jail adds a
# firewall-level ban so the attacker cannot even complete a TCP handshake.
[tcpser-gate]
enabled = true
port = 6400
filter = tcpser-gate
logpath = /var/log/tcpser/tcpser.log
maxretry = 5
findtime = 600
bantime = 3600
action = iptables-multiport[name=tcpser-gate, port="6400"]

# --- Web dashboard behind nginx (see samples/nginx/tcpser.conf) ------------
[tcpser-auth]
enabled = true
port = 443,80
filter = tcpser-auth
logpath = /var/log/nginx/tcpser.access.log
maxretry = 5
findtime = 300
bantime = 3600
action = iptables-multiport[name=tcpser, port="http,https"]

[tcpser-flood]
enabled = true
port = 443,80
filter = tcpser-flood
logpath = /var/log/nginx/tcpser.access.log
maxretry = 50
findtime = 60
bantime = 600
action = iptables-multiport[name=tcpser-flood, port="http,https"]

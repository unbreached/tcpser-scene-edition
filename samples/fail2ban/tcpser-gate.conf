# Fail2Ban filter for the TCPSER modem port (bot gate) - reads tcpser's OWN log
# (-L /var/log/tcpser/tcpser.log, -l 4 or higher). Place in /etc/fail2ban/filter.d/
#
# tcpser log line format:  YYYY-MM-DD HH:MM:SS:<thread-id>:LEVEL:message
[Definition]
failregex = ^\S+ \S+:\d+:INFO:Pre-connect gate failed for <HOST>;.*$
            ^\S+ \S+:\d+:INFO:Blocked IP <HOST> tried to connect.*$
            ^\S+ \S+:\d+:INFO:Rate limited IP <HOST>.*$
ignoreregex =

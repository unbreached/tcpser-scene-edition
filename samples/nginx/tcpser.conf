# TCPSER Dashboard - Nginx Configuration with TLS
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
#
# Auth: either terminate it here (auth_basic below, recommended) and run tcpser
# WITHOUT TCPSER_DASH_TOKEN on loopback, or keep the token. If you keep the
# token, use the log_format below so the ?token=... query string is NOT written
# to the access log (fail2ban and anyone with log access would see it).

# limit_req_zone is only valid in the http{} context (this file is included
# there by sites-enabled/), never inside server{}.
limit_req_zone $binary_remote_addr zone=tcpser:10m rate=10r/m;

# Access-log format without the query string ($uri instead of $request).
log_format tcpser_noquery '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

upstream tcpser_dashboard {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name tcpser.example.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tcpser.example.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/tcpser.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcpser.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'" always;

    # Basic auth (recommended; then run tcpser without a dashboard token)
    # auth_basic "TCPSER Dashboard";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        limit_req zone=tcpser burst=5 nodelay;

        proxy_pass http://tcpser_dashboard;
        proxy_http_version 1.1;
        # keep the upstream keepalive pool usable (no WebSocket upgrade is used)
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Server-Sent Events (/api/events): no buffering/caching, long read
        # timeout (tcpser sends an update every 5 s).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Block access to sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logs (query string stripped so a dashboard token never lands in the log)
    access_log /var/log/nginx/tcpser.access.log tcpser_noquery;
    error_log /var/log/nginx/tcpser.error.log;
}
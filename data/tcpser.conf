# /etc/tcpser/tcpser.conf  -  read by the systemd unit:
#   ExecStartPre=tcpser check --config /etc/tcpser/tcpser.conf
#   ExecStart=tcpser --config /etc/tcpser/tcpser.conf
#
# One `key = value` per line; keys are the long option names (tcpser -h).
# Flags take yes/no. `#` starts a comment. Everything before the first [line]
# is global; each [line] section is one modem and needs `device = ...` or
# `ip232 = PORT`. Line settings carry over to the next [line] unless changed.
# Validate after editing:  tcpser check --config /etc/tcpser/tcpser.conf
# Secrets (gate password, dashboard token) go in /etc/tcpser/tcpser.env.

listen     = 6400
log-level  = 4
log-file   = /var/log/tcpser/tcpser.log
connlog    = /var/log/tcpser/connections.csv
stats      = /var/lib/tcpser/stats
blocklist  = /var/lib/tcpser/tcpser.blocklist

# Web console on localhost; put nginx + TLS in front to reach it remotely
# (samples/nginx). Token: TCPSER_DASH_TOKEN in tcpser.env.
web        = 8080
web-bind   = 127.0.0.1
#name      = My BBS

# Notifications (Discord / Slack / ntfy / JSON POST), repeatable
#webhook   = https://discord.com/api/webhooks/...

[line]
device         = /dev/ttyUSB0
speed          = 2400
#init          = &C0&K3
backspace-gate = yes
#password      = env:TCPSER_GATE_PASSWORD
gate-timeout   = 20
gate-fails     = 3
banner         = /usr/local/share/tcpser/prelogin.seq
granted        = /usr/local/share/tcpser/accessgranted.seq
#gate-hook     = gate_success_log
watchdog       = 120
#max-session   = 120

# Second line (e.g. VICE over ip232); inherits the gate settings above
#[line]
#ip232         = 25232
#speed         = 38400

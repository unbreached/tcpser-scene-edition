# Minimal cc65 linker config for a standalone C64 .prg (load $0801, BASIC stub).
# HEADER writes the 2-byte load-address word at the very start of the file.
MEMORY {
    ZP:     start = $0002, size = $00FE, type = rw, define = yes;
    HEADER: start = $0000, size = $0002, file = %O;
    MAIN:   start = $0801, size = $C7FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp,  optional = yes;
    HEADER:   load = HEADER, type = ro;
    CODE:     load = MAIN,   type = rw;
    RODATA:   load = MAIN,   type = ro,  optional = yes;
    DATA:     load = MAIN,   type = rw,  optional = yes;
    BSS:      load = MAIN,   type = bss, optional = yes, define = yes;
}
